name: Cobrinha de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#ea580c&color_dots=#f3e6d8,#fed7aa,#fdba74,#fb923c,#ea580c
            dist/snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#221813,#7c2d12,#c2410c,#ea580c,#fb923c

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Atualiza a cobrinha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
