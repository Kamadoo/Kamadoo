name: Katana de contribuições

on:
  schedule:
    - cron: "0 6 * * *" # todo dia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  katana:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Gera o gráfico com a katana
        run: python3 scripts/katana.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Atualiza a katana"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
